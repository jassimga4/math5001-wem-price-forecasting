services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: math5001-wem:latest
    working_dir: /app
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Australia/Perth}
      PYTHONUNBUFFERED: "1"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-math5001}
      PANEL_PATH: ${PANEL_PATH:-data/processed/wem_5min_panel.parquet}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-raw}
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --IdentityProvider.token=${JUPYTER_TOKEN:-math5001}

  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: math5001-wem:latest
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Australia/Perth}
      PYTHONUNBUFFERED: "1"
      PANEL_PATH: ${PANEL_PATH:-data/processed/wem_5min_panel.parquet}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-raw}
    stdin_open: true
    tty: true
    command: bash

  inspect:
    build:
      context: .
      dockerfile: Dockerfile
    image: math5001-wem:latest
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Australia/Perth}
      PYTHONUNBUFFERED: "1"
      PANEL_PATH: ${PANEL_PATH:-data/processed/wem_5min_panel.parquet}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-raw}
    command: python scripts/inspect_panel.py
